name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check dsh/index.js
          node --check dsh/notify.js
          node --check dsh/config.js
          node --check dsh/text.js
      - name: Unit tests
        run: npm test
      - name: Manifest sanity
        run: |
          node -e "const p=require('./package.json');if(!p.dsh?.bundle?.patch)process.exit(1);if(!p.dsh.bundle.platforms?.includes('darwin'))process.exit(1)"
