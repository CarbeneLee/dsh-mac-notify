<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="dsh-mac-notify 的四种 macOS 通知">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2733"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="960" height="470" fill="url(#wall)"/>
  <text x="40" y="46" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="20" font-weight="600">dsh-mac-notify · 四种横幅</text>
  <text x="40" y="72" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="13">任务完成 / 失败 / 需要批准 / 需要回答 —— 人不在窗口前也不会漏</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif">
    <g filter="url(#shadow)">
      <rect x="40" y="96" width="880" height="76" rx="16" fill="#f5f5f7" fill-opacity="0.97"/>
      <rect x="56" y="112" width="44" height="44" rx="11" fill="#2f81f7"/>
      <text x="78" y="140" fill="#fff" font-size="20" text-anchor="middle">✓</text>
      <text x="116" y="126" fill="#1d1d1f" font-size="15" font-weight="600">DeepSeek Harness</text>
      <text x="116" y="145" fill="#1d1d1f" font-size="13" font-weight="500">✅ 任务完成 · 2分13秒</text>
      <text x="116" y="163" fill="#6e6e73" font-size="12">修复登录页样式 — 改了三处间距，刷新页面即可验证</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="40" y="186" width="880" height="76" rx="16" fill="#f5f5f7" fill-opacity="0.97"/>
      <rect x="56" y="202" width="44" height="44" rx="11" fill="#ff453a"/>
      <text x="78" y="230" fill="#fff" font-size="20" text-anchor="middle">!</text>
      <text x="116" y="216" fill="#1d1d1f" font-size="15" font-weight="600">DeepSeek Harness</text>
      <text x="116" y="235" fill="#1d1d1f" font-size="13" font-weight="500">❌ 任务失败 · 18秒</text>
      <text x="116" y="253" fill="#6e6e73" font-size="12">跑一遍测试 — HTTP 429 Too Many Requests</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="40" y="276" width="880" height="76" rx="16" fill="#f5f5f7" fill-opacity="0.97"/>
      <rect x="56" y="292" width="44" height="44" rx="11" fill="#ff9f0a"/>
      <text x="78" y="320" fill="#fff" font-size="19" text-anchor="middle">?</text>
      <text x="116" y="306" fill="#1d1d1f" font-size="15" font-weight="600">DeepSeek Harness</text>
      <text x="116" y="325" fill="#1d1d1f" font-size="13" font-weight="500">🔐 需要你的批准</text>
      <text x="116" y="343" fill="#6e6e73" font-size="12">bash · 需要访问工作区外的文件 · 部署脚本</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="40" y="366" width="880" height="76" rx="16" fill="#f5f5f7" fill-opacity="0.97"/>
      <rect x="56" y="382" width="44" height="44" rx="11" fill="#30d158"/>
      <text x="78" y="410" fill="#fff" font-size="19" text-anchor="middle">…</text>
      <text x="116" y="396" fill="#1d1d1f" font-size="15" font-weight="600">DeepSeek Harness</text>
      <text x="116" y="415" fill="#1d1d1f" font-size="13" font-weight="500">❓ 需要你的回答</text>
      <text x="116" y="433" fill="#6e6e73" font-size="12">要部署到哪个环境？（共 2 个问题）</text>
    </g>
  </g>
</svg>
